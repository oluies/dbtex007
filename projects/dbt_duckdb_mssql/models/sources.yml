version: 2

sources:
  - name: src_ddd
    database: src        # matches the ATTACH alias set in the mssql_native materialization
    schema: ddd
    description: |
      Tables in the source SQL Server database, exposed via the mssql
      community extension. The ATTACH happens inside the mssql_native
      materialization; referencing these via the dbt `source()` jinja
      function compiles to `src.ddd.<table>` three-part names which
      DuckDB routes through TDS.
    tables:
      - name: locations
      - name: voyages
      - name: cargo
      - name: itinerary
      - name: legs
      - name: handling_events
