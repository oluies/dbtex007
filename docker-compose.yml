# Two SQL Server 2022 instances: source (seeded with the DDD cargo schema)
# and destination (empty). dbt runs on the host and connects via the published
# ports. The init script wrapper starts sqlservr in the background, waits for
# readiness, and applies any SQL files in /init in lexicographic order.
#
# On Apple Silicon the official mssql/server image is amd64-only; Docker Desktop
# transparently emulates it via Rosetta. Slower than native but works. See
# README.md for the azure-sql-edge fallback.

services:
  mssql-source:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ddd-mssql-source
    platform: linux/amd64
    ports:
      - "11433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: Developer
      INIT_DB_NAME: ddd_source
    volumes:
      - mssql_source_data:/var/opt/mssql
      - ./docker/mssql-init/entrypoint.sh:/init/entrypoint.sh:ro
      - ./docker/mssql-init/source:/init/sql:ro
    entrypoint: ["/bin/bash", "/init/entrypoint.sh"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -C -No -Q "SELECT 1 FROM sys.databases WHERE name = '$$INIT_DB_NAME'" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mssql-dest:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ddd-mssql-dest
    platform: linux/amd64
    ports:
      - "21433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: Developer
      INIT_DB_NAME: ddd_dest
    volumes:
      - mssql_dest_data:/var/opt/mssql
      - ./docker/mssql-init/entrypoint.sh:/init/entrypoint.sh:ro
      - ./docker/mssql-init/dest:/init/sql:ro
    entrypoint: ["/bin/bash", "/init/entrypoint.sh"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -C -No -Q "SELECT 1 FROM sys.databases WHERE name = '$$INIT_DB_NAME'" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mssql_source_data:
  mssql_dest_data:
