name: dbt-autofix audit

# Runs `uvx dbt-autofix deprecations --dry-run` against both dbt projects
# whenever PR changes touch dbt configuration, models, macros, or this
# workflow file. Surfaces any deprecation suggestions in the workflow run
# summary plus a downloadable artifact, so reviewers can see deprecations
# *introduced by the PR* before merging.
#
# Manual via the Actions tab too. No cron — autofix only matters when
# something changes (model code, project config, or the dbt-core
# version in requirements.txt). All three are PR-trigger paths below.
#
# NOT a required check. Findings are informational; the PR author / reviewer
# decides whether to apply them. Some suggestions (e.g. moving custom
# materialization configs under +meta) are intentionally not applied — see
# the inline comments in projects/dbt_duckdb_mssql/dbt_project.yml.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "projects/*/dbt_project.yml"
      - "projects/*/models/**"
      - "projects/*/macros/**"
      - "projects/*/requirements.txt"
      - ".github/workflows/dbt-autofix-audit.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: dbt-autofix deprecations (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        project: [dbt_python_copy, dbt_duckdb_mssql]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run dbt-autofix (dry-run)
        id: autofix
        working-directory: projects/${{ matrix.project }}
        # --dry-run never modifies files. We strip ANSI escapes from the
        # output so the artifact reads cleanly and the workflow summary
        # renders properly. Exit 0 always so a flagged deprecation is
        # informational, not a hard failure.
        run: |
          set -uo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/audit"
          log="${GITHUB_WORKSPACE}/audit/${{ matrix.project }}.log"
          uvx dbt-autofix deprecations --dry-run 2>&1 \
            | sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' \
            | tee "$log"

      - name: Render summary
        if: always()
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          log="${GITHUB_WORKSPACE}/audit/${PROJECT}.log"
          {
            echo "### dbt-autofix deprecations — \`${PROJECT}\`"
            echo
            if [[ -s "$log" ]]; then
              # Heuristic flag for "found something interesting"
              if grep -qE 'NOT APPLIED|Refactored|deprecation|Error processing' "$log"; then
                echo "⚠️ Suggestions surfaced. See log below or download the artifact."
              else
                echo "✅ No deprecation suggestions."
              fi
              echo
              echo '```'
              tail -80 "$log"
              echo '```'
            else
              echo "_No output captured — see workflow logs._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-autofix-${{ matrix.project }}-${{ github.run_id }}
          path: audit/${{ matrix.project }}.log
          retention-days: 30
          if-no-files-found: warn
