name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lint — just compiles both dbt projects against a temp DuckDB target.
  # No SQL Server needed: env vars are stubbed and the mssql_native
  # materialization defers env_var() lookups until run-time.
  lint:
    name: dbt parse
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [dbt_python_copy, dbt_duckdb_mssql]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: projects/${{ matrix.project }}/requirements.txt

      - name: Install project deps
        working-directory: projects/${{ matrix.project }}
        run: uv pip install --system -r requirements.txt

      - name: dbt parse
        working-directory: projects/${{ matrix.project }}
        env:
          DBT_PROFILES_DIR: "."
          # Stubs satisfy env_var() evaluations during parse if any leak through.
          SRC_MSSQL_URL: mssql+pymssql://sa:stub@localhost:11433/ddd_source
          DST_MSSQL_URL: mssql+pymssql://sa:stub@localhost:21433/ddd_dest
          SRC_MSSQL_DUCKDB_CONN: "Server=localhost,11433;Database=ddd_source;User Id=sa;Password=stub;TrustServerCertificate=true"
          DST_MSSQL_DUCKDB_CONN: "Server=localhost,21433;Database=ddd_dest;User Id=sa;Password=stub;TrustServerCertificate=true"
          MSSQL_SA_PASSWORD: stub
        run: dbt parse

  # Full end-to-end: bring up both SQL Servers, run each project against
  # a fresh seed, assert source and dest row counts match.
  integration:
    name: end-to-end (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project:
          - dbt_python_copy
          - dbt_duckdb_mssql
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: projects/${{ matrix.project }}/requirements.txt

      # Persist the downloaded `mssql` community extension across runs so
      # `INSTALL mssql FROM community` inside the materialization is a
      # near-no-op cache hit instead of a re-download every job.
      - name: Cache DuckDB extensions
        if: matrix.project == 'dbt_duckdb_mssql'
        uses: actions/cache@v4
        with:
          path: ~/.duckdb
          key: duckdb-ext-${{ runner.os }}-mssql-v1

      - name: Materialize .env and export into job env
        # We don't `source .env` in subsequent steps — the ADO.NET-style
        # connection strings contain ';' and spaces that bash would split on.
        # Instead, copy .env.example to .env (for docker-compose) and also
        # promote every line into $GITHUB_ENV so later steps see them as
        # ordinary env vars.
        run: |
          cp .env.example .env
          while IFS= read -r line; do
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            key="${line%%=*}"
            val="${line#*=}"
            val="${val#\'}"; val="${val%\'}"
            val="${val#\"}"; val="${val%\"}"
            printf '%s=%s\n' "$key" "$val" >> "$GITHUB_ENV"
          done < .env

      - name: Install Python deps for ${{ matrix.project }}
        run: uv pip install --system -r projects/${{ matrix.project }}/requirements.txt

      - name: Start SQL Server containers
        run: docker compose up -d --wait

      - name: Wait for source seed to complete
        run: |
          set -euo pipefail
          for i in {1..30}; do
            count=$(docker exec ddd-mssql-source /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -No -d ddd_source -h-1 -W \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM ddd.locations" 2>/dev/null \
              | tr -d '[:space:]' || true)
            count="${count:-0}"
            if [[ "$count" == "10" ]]; then
              echo "Source seeded ($count locations)."
              exit 0
            fi
            echo "  attempt $i: locations=$count, waiting..."
            sleep 2
          done
          echo "::error::Source seed did not complete in time"
          docker compose logs mssql-source | tail -100
          exit 1

      - name: Show source row counts
        run: make seed-check

      - name: Run dbt project
        env:
          DBT_PROFILES_DIR: "."
        working-directory: projects/${{ matrix.project }}
        run: dbt run

      - name: Assert dest row counts match source
        run: |
          set -euo pipefail
          tables=(locations voyages cargo itinerary legs handling_events)
          fail=0
          for t in "${tables[@]}"; do
            src=$(docker exec ddd-mssql-source /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -No -d ddd_source -h-1 -W \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM ddd.$t" | tr -d '[:space:]')
            dst=$(docker exec ddd-mssql-dest /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -No -d ddd_dest -h-1 -W \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM ddd.$t" | tr -d '[:space:]')
            if [[ "$src" != "$dst" ]]; then
              echo "::error::$t: src=$src dst=$dst (mismatch)"
              fail=1
            else
              echo "  $t: $src rows (ok)"
            fi
          done
          exit $fail

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose logs --tail=200 mssql-source || true
          docker compose logs --tail=200 mssql-dest || true

      # No teardown step: the runner VM is discarded immediately after the
      # job, so `docker compose down -v` only burns ~11s of billing minutes.
