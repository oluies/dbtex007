name: nightly · mssql ext canary

# Smoke-tests the upstream hugr-lab/mssql-extension at literal HEAD by
# downloading BOTH the duckdb-cli AND the mssql extension binaries from
# the same upstream CI run (they're ABI-matched by construction — built
# together against DuckDB dev branch) and running our copy SQL through
# that bundled duckdb-cli against our compose containers.
#
# What it catches: TDS-protocol regressions, ATTACH semantics, type
# mapping, CREATE OR REPLACE TABLE across the attach boundary.
#
# What it does NOT catch: regressions specific to our dbt materialization
# (because we bypass dbt and dbt-duckdb here). The regular
# `end-to-end (dbt_duckdb_mssql)` job in ci.yml covers that path against
# the community-released extension.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/nightly-mssql-ext.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required so gh run download can pull artifacts from hugr-lab's public repo.
  actions: read

jobs:
  canary:
    name: smoke (upstream HEAD · duckdb-cli + mssql extension)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Materialize .env and export into job env
        run: |
          cp .env.example .env
          while IFS= read -r line; do
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            key="${line%%=*}"
            val="${line#*=}"
            val="${val#\'}"; val="${val%\'}"
            val="${val#\"}"; val="${val%\"}"
            printf '%s=%s\n' "$key" "$val" >> "$GITHUB_ENV"
          done < .env

      - name: Download upstream duckdb-cli + extension (same CI run)
        id: ext
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/upstream
          # Latest successful CI run on hugr-lab/mssql-extension main.
          # Take BOTH artifacts from this single run so the duckdb-cli
          # and the .duckdb_extension are ABI-matched by construction
          # (released DuckDB can't load these — they target DuckDB HEAD).
          read -r run_id run_sha run_url < <(
            gh api 'repos/hugr-lab/mssql-extension/actions/runs?branch=main&status=success&per_page=20' \
              --jq '[.workflow_runs[] | select(.name == "CI")] | .[0] | "\(.id) \(.head_sha[0:7]) \(.html_url)"'
          )
          echo "Upstream CI run: $run_url (sha $run_sha)"
          gh run download "$run_id" --repo hugr-lab/mssql-extension \
            --name duckdb-cli-linux_amd64       --dir /tmp/upstream/duckdb-cli
          gh run download "$run_id" --repo hugr-lab/mssql-extension \
            --name mssql-extension-linux_amd64  --dir /tmp/upstream/ext

          duckdb_bin=$(find /tmp/upstream/duckdb-cli -type f -name 'duckdb' -print -quit)
          ext_path=$(find /tmp/upstream/ext -name '*.duckdb_extension' -print -quit)
          [[ -z "$duckdb_bin" ]] && { echo "::error::no duckdb cli in artifact"; ls -lR /tmp/upstream; exit 1; }
          [[ -z "$ext_path"   ]] && { echo "::error::no .duckdb_extension in artifact"; ls -lR /tmp/upstream; exit 1; }
          chmod +x "$duckdb_bin"

          # Confirm the duckdb-cli came up and report its version banner;
          # this is also a sanity check that the binary runs at all.
          duckdb_version=$("$duckdb_bin" -version)
          echo "Upstream duckdb-cli: $duckdb_version"

          echo "DUCKDB_BIN=$duckdb_bin"          >> "$GITHUB_ENV"
          echo "MSSQL_EXT_PATH=$ext_path"        >> "$GITHUB_ENV"
          echo "upstream_sha=$run_sha"           >> "$GITHUB_OUTPUT"
          echo "upstream_run_url=$run_url"       >> "$GITHUB_OUTPUT"
          {
            echo "### Canary build under test"
            echo "- Upstream repo: [hugr-lab/mssql-extension](https://github.com/hugr-lab/mssql-extension)"
            echo "- Upstream commit: \`$run_sha\`"
            echo "- Upstream CI run: $run_url"
            echo "- duckdb-cli: \`$duckdb_version\`"
            echo "- Extension: \`$ext_path\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start SQL Server containers
        run: docker compose up -d --wait

      - name: Wait for source seed to complete
        run: |
          set -euo pipefail
          for i in {1..30}; do
            count=$(docker exec ddd-mssql-source /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -No -d ddd_source -h-1 -W \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM ddd.locations" 2>/dev/null \
              | tr -d '[:space:]' || true)
            count="${count:-0}"
            if [[ "$count" == "10" ]]; then
              echo "Source seeded ($count locations)."
              exit 0
            fi
            echo "  attempt $i: locations=$count, waiting..."
            sleep 2
          done
          echo "::error::Source seed did not complete in time"
          docker compose logs mssql-source | tail -100
          exit 1

      - name: Smoke SQL via upstream duckdb-cli
        # Mirrors the materialization's hot path: LOAD extension, ATTACH
        # both DBs, CREATE OR REPLACE TABLE across the boundary. Runs
        # against the DDD tables our regular suite uses so any
        # type-mapping / TDS regression surfaces here. The -unsigned
        # flag is the only way to allow unsigned extensions — it's a
        # startup config, can't be SET after the database opens.
        run: |
          set -euo pipefail
          "$DUCKDB_BIN" -unsigned :memory: <<SQL
          LOAD '${MSSQL_EXT_PATH}';
          ATTACH '${SRC_MSSQL_DUCKDB_CONN}' AS src (TYPE mssql, READ_ONLY);
          ATTACH '${DST_MSSQL_DUCKDB_CONN}' AS dst (TYPE mssql);
          CREATE OR REPLACE TABLE dst.ddd.locations       AS SELECT * FROM src.ddd.locations;
          CREATE OR REPLACE TABLE dst.ddd.voyages         AS SELECT * FROM src.ddd.voyages;
          CREATE OR REPLACE TABLE dst.ddd.cargo           AS SELECT * FROM src.ddd.cargo;
          CREATE OR REPLACE TABLE dst.ddd.itinerary       AS SELECT * FROM src.ddd.itinerary;
          CREATE OR REPLACE TABLE dst.ddd.legs            AS SELECT * FROM src.ddd.legs;
          CREATE OR REPLACE TABLE dst.ddd.handling_events AS SELECT * FROM src.ddd.handling_events;
          SQL

      - name: Assert dest row counts match source
        run: |
          set -euo pipefail
          tables=(locations voyages cargo itinerary legs handling_events)
          fail=0
          for t in "${tables[@]}"; do
            src=$(docker exec ddd-mssql-source /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -No -d ddd_source -h-1 -W \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM ddd.$t" | tr -d '[:space:]')
            dst=$(docker exec ddd-mssql-dest /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -No -d ddd_dest -h-1 -W \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM ddd.$t" | tr -d '[:space:]')
            if [[ "$src" != "$dst" ]]; then
              echo "::error::$t: src=$src dst=$dst (mismatch — upstream sha ${UPSTREAM_SHA} may have regressed)"
              fail=1
            else
              echo "  $t: $src rows (ok)"
            fi
          done
          exit $fail
        env:
          UPSTREAM_SHA: ${{ steps.ext.outputs.upstream_sha }}

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose logs --tail=200 mssql-source || true
          docker compose logs --tail=200 mssql-dest || true
