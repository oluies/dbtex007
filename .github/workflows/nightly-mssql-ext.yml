name: nightly · mssql ext canary

# Runs the dbt_duckdb_mssql end-to-end suite against the **latest tagged
# release** of hugr-lab/mssql-extension — *before* that tag is picked up
# by the DuckDB community-extensions repo (typically a several-day lag).
# Catches regressions in a release that `INSTALL mssql FROM community`
# is about to start serving to everyone.
#
# Why not literal upstream HEAD? DuckDB extensions are ABI-pinned to the
# exact DuckDB SHA they were built against. Upstream CI artifacts are
# built against DuckDB's dev branch (some commit SHA), which won't load
# into a released DuckDB. Tagged releases declare the DuckDB version
# they target (see release notes), so they're loadable. Building from
# source against our pinned DuckDB would let us test literal HEAD but
# adds ~10 min of CMake build time.
#
# Triggers:
# - daily at 04:00 UTC
# - manual via the Actions tab
# - on PRs that touch the materialization or this workflow itself, so
#   changes to the side-loading mechanism are verified before merging
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/nightly-mssql-ext.yml"
      - "projects/dbt_duckdb_mssql/macros/materialization_mssql_native.sql"
      - "projects/dbt_duckdb_mssql/profiles.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required so gh run download can pull artifacts from hugr-lab's public repo.
  actions: read

jobs:
  canary:
    # NOT marked as required in branch protection. Failures here are
    # informational — they indicate the upstream extension's latest
    # release breaks our integration before it reaches `INSTALL ... FROM community`.
    name: end-to-end (dbt_duckdb_mssql · latest upstream release)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: projects/dbt_duckdb_mssql/requirements.txt

      - name: Materialize .env and export into job env
        run: |
          cp .env.example .env
          while IFS= read -r line; do
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            key="${line%%=*}"
            val="${line#*=}"
            val="${val#\'}"; val="${val%\'}"
            val="${val#\"}"; val="${val%\"}"
            printf '%s=%s\n' "$key" "$val" >> "$GITHUB_ENV"
          done < .env

      - name: Resolve and download latest hugr-lab mssql-extension release
        id: ext
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mssql-ext
          # Latest non-prerelease tag on hugr-lab/mssql-extension. Excludes the
          # asset-less v0.1.0 placeholder and any draft/prerelease entries.
          read -r tag release_url < <(
            gh api 'repos/hugr-lab/mssql-extension/releases?per_page=20' \
              --jq '[.[] | select(.draft == false and .prerelease == false and (.assets | length) > 0)] | .[0] | "\(.tag_name) \(.html_url)"'
          )
          echo "Resolving release: $tag ($release_url)"
          gh release download "$tag" --repo hugr-lab/mssql-extension \
            --pattern '*-linux_amd64.duckdb_extension' --dir /tmp/mssql-ext
          ext_path=$(find /tmp/mssql-ext -name '*-linux_amd64.duckdb_extension' -print -quit)
          if [[ -z "$ext_path" ]]; then
            echo "::error::No linux_amd64 .duckdb_extension asset on $tag"
            ls -la /tmp/mssql-ext
            exit 1
          fi
          echo "MSSQL_EXT_LOCAL_PATH=$ext_path" >> "$GITHUB_ENV"
          echo "upstream_tag=$tag"           >> "$GITHUB_OUTPUT"
          echo "upstream_release_url=$release_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Canary build under test"
            echo "- Upstream repo: [hugr-lab/mssql-extension](https://github.com/hugr-lab/mssql-extension)"
            echo "- Upstream release: [\`$tag\`]($release_url)"
            echo "- Local binary: \`$ext_path\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Python deps for dbt_duckdb_mssql
        run: uv pip install --system -r projects/dbt_duckdb_mssql/requirements.txt

      - name: Start SQL Server containers
        run: docker compose up -d --wait

      - name: Wait for source seed to complete
        run: |
          set -euo pipefail
          for i in {1..30}; do
            count=$(docker exec ddd-mssql-source /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -No -d ddd_source -h-1 -W \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM ddd.locations" 2>/dev/null \
              | tr -d '[:space:]' || true)
            count="${count:-0}"
            if [[ "$count" == "10" ]]; then
              echo "Source seeded ($count locations)."
              exit 0
            fi
            echo "  attempt $i: locations=$count, waiting..."
            sleep 2
          done
          echo "::error::Source seed did not complete in time"
          docker compose logs mssql-source | tail -100
          exit 1

      - name: Run dbt project against latest release
        env:
          DBT_PROFILES_DIR: "."
        working-directory: projects/dbt_duckdb_mssql
        run: dbt run

      - name: Assert dest row counts match source
        run: |
          set -euo pipefail
          tables=(locations voyages cargo itinerary legs handling_events)
          fail=0
          for t in "${tables[@]}"; do
            src=$(docker exec ddd-mssql-source /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -No -d ddd_source -h-1 -W \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM ddd.$t" | tr -d '[:space:]')
            dst=$(docker exec ddd-mssql-dest /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -No -d ddd_dest -h-1 -W \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM ddd.$t" | tr -d '[:space:]')
            if [[ "$src" != "$dst" ]]; then
              echo "::error::$t: src=$src dst=$dst (mismatch — upstream release ${UPSTREAM_TAG} may have regressed)"
              fail=1
            else
              echo "  $t: $src rows (ok)"
            fi
          done
          exit $fail
        env:
          UPSTREAM_TAG: ${{ steps.ext.outputs.upstream_tag }}

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose logs --tail=200 mssql-source || true
          docker compose logs --tail=200 mssql-dest || true
